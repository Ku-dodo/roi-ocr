name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Read release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:GITHUB_REF_NAME"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1+cpu torchvision==0.29.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build release package
        shell: pwsh
        run: .\build.ps1 -PythonExecutable "$env:pythonLocation\python.exe" -Version $env:RELEASE_VERSION

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = ".\dist\OCRTool-$env:RELEASE_VERSION-windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME $archive "$archive.sha256" --title $env:GITHUB_REF_NAME --generate-notes
